name: Garder les bases éveillées
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller chaque base
        env:
          BASES: ${{ secrets.STOCKAARUD_BASES }}
        run: |
          if [ -z "$BASES" ]; then echo "Secret absent"; exit 0; fi
          fail=0
          while read -r ref key; do
            case "$ref" in ''|\#*) continue;; esac
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://$ref.supabase.co/rest/v1/rpc/ping" \
              -H "apikey: $key" -H "Authorization: Bearer $key" -H "Content-Type: application/json" -d '{}')
            echo "$ref : $code"
            [ "$code" = "200" ] || fail=1
          done <<< "$BASES"
          exit $fail
